name: PlaySphere CI Pipeline

on:
  push:
    branches: ["main", "development-new"]
  pull_request:
    branches: ["main", "development-new"]

jobs:
  # ----------------------------------------------------
  # Job 1: Frontend Build Verification (Runs in Parallel)
  # ----------------------------------------------------
  frontend-ci:
    name: Frontend Quality & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run build

  # ----------------------------------------------------
  # Job 2: Backend Integration & API Health Check
  # ----------------------------------------------------
  backend-ci:
    name: Backend API & Database Integration
    runs-on: ubuntu-latest

    # Spin up ephemeral MySQL service container inside GitHub Actions
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: playsphere
          MYSQL_USER: playsphere_user
          MYSQL_PASSWORD: playsphere_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      # Load database schema and initial seed data into the MySQL service
      - name: Seed Test Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u playsphere_user -pplaysphere_pass playsphere < db/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u playsphere_user -pplaysphere_pass playsphere < db/seed.sql

      # Start backend Express server in background (&)
      - name: Start Backend Server
        env:
          PORT: 5000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: playsphere_user
          DB_PASSWORD: playsphere_pass
          DB_NAME: playsphere
          JWT_SECRET: test_ci_jwt_secret_key
        run: |
          node src/server.js &
          sleep 5

      # Verify the server and database are healthy and returning data
      - name: Test /api/health Endpoint
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:5000/api/health)
          echo "Health response: $RESPONSE"
          echo $RESPONSE | grep '"status":"healthy"'

      - name: Test /api/games Endpoint
        run: |
          GAMES=$(curl -s http://127.0.0.1:5000/api/games)
          echo "Games count check: $GAMES"
          echo $GAMES | grep 'VALORANT'
  # ----------------------------------------------------
  # Job 3: DevSecOps Vulnerability Scan (Trivy)
  # ----------------------------------------------------
  security-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Build local container images for scanning
      - name: Build Backend Image
        run: docker build -t playsphere-backend:${{ github.sha }} ./backend

      - name: Build Frontend Image
        run: docker build -t playsphere-frontend:${{ github.sha }} ./frontend

      # 2. Scan Backend Image for Critical/High CVEs
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: playsphere-backend:${{ github.sha }}
          format: "table"
          exit-code: "0" # Set to '1' if you want unpatched CVEs to fail the build
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # 3. Scan Frontend Image for Critical/High CVEs
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: playsphere-frontend:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
