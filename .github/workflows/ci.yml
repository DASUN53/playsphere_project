name: PlaySphere CI Pipeline

# 1. Trigger: When should this workflow run?
on:
  push:
    branches: ["main", "development-new"]
  pull_request:
    branches: ["main", "development-new"]

# 2. Jobs: What tasks should run?
jobs:
  frontend-ci:
    name: Frontend Quality & Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      # Step 1: Check out the repository code onto the runner VM
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js 20 with npm caching for faster builds
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install clean dependencies
      - name: Install Frontend Dependencies
        run: npm ci

      # Step 4: Run Vite Production Build
      - name: Build Frontend (Vite)
        run: npm run build
